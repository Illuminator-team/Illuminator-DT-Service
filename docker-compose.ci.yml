services:
  heat-init:
    command:
      - python
      - -m
      - heat_net_map.api
      - initialize
      - --mode
      - fixture
      - --allow-fixture

  reverse-proxy:
    ports: !override
      - "18080:80"
      - "18443:443"
      - "18081:8080"

  timescale:
    ports: !override
      - "15432:5432"

  redis-insight:
    profiles:
      - extended-rdp
    ports: !override
      - "15540:5540"

  grafana:
    profiles:
      - extended-rdp

  data-sync-service:
    profiles:
      - extended-rdp

  weather-data-service:
    profiles:
      - extended-rdp

  frequency-data-service:
    profiles:
      - extended-rdp

  pv-sim-service:
    profiles:
      - extended-rdp

  illuminator-service:
    profiles:
      - extended-rdp

  grid-init:
    command:
      - python
      - -m
      - grid_api
      - initialize
      - --fixture
      - /fixtures/alkmaar_grid_fixture.json
      - --allow-fixture
    volumes:
      - ./tests/fixtures/grid/alkmaar_grid_fixture.json:/fixtures/alkmaar_grid_fixture.json:ro

  layer-publisher:
    environment:
      GRID_EXPECTED_DATA_MODE: fixture
      GRID_EXPORT_BBOX: 4.74454,52.629131,4.835248,52.644642
      HEAT_EXPECTED_DATA_MODE: fixture

  orchestration-grid-init:
    image: ghcr.io/jortgroen/liander-grid-model-api@sha256:88d42d9ac15dbf6f20bbee0766ce0483abf360566f1e180b1018378b4053218c
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    command:
      - python
      - -m
      - grid_api
      - initialize
      - --fixture
      - /fixtures/orchestration_1483aa_bu03610709_grid_fixture.json
      - --buurt-pc6-crosswalk
      - /crosswalk/alkmaar-buurt-pc6-2025.json
      - --allow-fixture
    environment:
      GRID_API_DATA_DIR: /data
      GRID_API_CONTAINER_DIGEST: sha256:88d42d9ac15dbf6f20bbee0766ce0483abf360566f1e180b1018378b4053218c
    volumes:
      - orchestration-grid-model-data:/data
      - grid-crosswalk-data:/crosswalk:ro
      - ./tests/fixtures/grid/orchestration_1483aa_bu03610709_grid_fixture.json:/fixtures/orchestration_1483aa_bu03610709_grid_fixture.json:ro
    depends_on:
      grid-crosswalk-init:
        condition: service_completed_successfully
    restart: "no"

  orchestration-grid-api:
    image: ghcr.io/jortgroen/liander-grid-model-api@sha256:88d42d9ac15dbf6f20bbee0766ce0483abf360566f1e180b1018378b4053218c
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      GRID_API_DATA_DIR: /data
      GRID_API_CONTAINER_DIGEST: sha256:88d42d9ac15dbf6f20bbee0766ce0483abf360566f1e180b1018378b4053218c
    volumes:
      - orchestration-grid-model-data:/data
    depends_on:
      orchestration-grid-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8080/ready', timeout=3); assert response.status == 200"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 20
    restart: unless-stopped

  congestion-backend:
    environment:
      GRID_API_BASE_URL: http://orchestration-grid-api:8080
    depends_on:
      orchestration-grid-api:
        condition: service_healthy

  policy-tool-backend:
    environment:
      GRID_API_URL: http://orchestration-grid-api:8080
    depends_on:
      orchestration-grid-api:
        condition: service_healthy

volumes:
  orchestration-grid-model-data:
