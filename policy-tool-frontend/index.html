<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alkmaar Urban Energy Analytics</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="search-box" class="floating-ui">
    <div class="search-flex">
        <input type="text" id="search-input" placeholder="eg 1815AG">
        <button id="search-btn">SEARCH</button>
    </div>
</div>

<div id="controls" class="floating-ui">
    <div class="control-label">Map Layer</div>
    <div class="radio-group">
        <div class="radio-item">
            <input type="radio" name="layer" value="gas" id="r-gas" checked> 
            <label for="r-gas">GAS CONSUMPTION (m³)</label>
        </div>
        <div class="radio-item">
            <input type="radio" name="layer" value="elec" id="r-elec"> 
            <label for="r-elec">ELEC CONSUMPTION (kWh)</label>
        </div>
        <div class="radio-item">
            <input type="radio" name="layer" value="pv_capacity" id="r-pv-capacity">
            <label for="r-pv-capacity">PV CAPACITY (kWp)</label>
        </div>
        <div class="radio-item">
            <input type="radio" name="layer" value="grid_network" id="r-grid-network">
            <label for="r-grid-network">ELECTRICITY GRID</label>
        </div>
        <div class="radio-item">
            <input type="radio" name="layer" value="public_wind_turbines" id="r-wind-turbines">
            <label for="r-wind-turbines">WIND TURBINES</label>
        </div>
        <div class="layer-select-item">
            <label for="heat-layer-select">HEAT EVIDENCE</label>
            <select id="heat-layer-select">
                <option value="" selected>SELECT LAYER</option>
                <option value="reported_neighbourhood_heat_consumers">Neighbourhood consumers</option>
                <option value="inferred_pc6_heat_consumers">Inferred PC6 consumers</option>
                <option value="registered_heat_network_developments">Registered developments</option>
                <option value="documented_actual_heat_sources">Actual heat sources</option>
                <option value="documented_large_heat_consumers">Large heat consumers</option>
                <option value="potential_heat_sources">Potential heat sources</option>
            </select>
        </div>
    </div>
    <fieldset id="grid-visibility" class="grid-visibility" hidden>
        <legend>Grid visibility</legend>
        <label class="visibility-item" for="grid-lv-lines">
            <input type="checkbox" id="grid-lv-lines" checked>
            <span class="line-swatch swatch-lv" aria-hidden="true"></span>
            <span>LV lines</span>
        </label>
        <label class="visibility-item" for="grid-mv-lines">
            <input type="checkbox" id="grid-mv-lines" checked>
            <span class="line-swatch swatch-mv" aria-hidden="true"></span>
            <span>MV lines</span>
        </label>
        <label class="visibility-item" for="grid-hv-lines">
            <input type="checkbox" id="grid-hv-lines" checked>
            <span class="line-swatch swatch-hv" aria-hidden="true"></span>
            <span>HV lines</span>
        </label>
        <label class="visibility-item" for="grid-lv-mv-transformers">
            <input type="checkbox" id="grid-lv-mv-transformers" checked>
            <span class="point-swatch swatch-lv-mv" aria-hidden="true"></span>
            <span>LV/MV transformers</span>
        </label>
        <label class="visibility-item" for="grid-mv-hv-transformers">
            <input type="checkbox" id="grid-mv-hv-transformers" checked>
            <span class="point-swatch swatch-mv-hv" aria-hidden="true"></span>
            <span>MV/HV transformers</span>
        </label>
        <label class="visibility-item" for="grid-lv-mv-reach">
            <input type="checkbox" id="grid-lv-mv-reach">
            <span class="area-swatch area-swatch-lv-mv" aria-hidden="true"></span>
            <span>LV/MV reach (PC6 shares)</span>
        </label>
        <label class="visibility-item" for="grid-mv-hv-reach">
            <input type="checkbox" id="grid-mv-hv-reach" checked>
            <span class="area-swatch area-swatch-mv-hv" aria-hidden="true"></span>
            <span>MV/HV reach (PC6 shares)</span>
        </label>
    </fieldset>
    <div class="layer-health" aria-live="polite">
        <div class="layer-source-row">
            <span class="source-indicator" aria-hidden="true"></span>
            <span id="layer-source-status" data-state="loading">Loading layer</span>
        </div>
        <div class="quality-row" title="Qualitative data completeness level">
            <span id="layer-quality-meter" class="quality-meter quality-level-2" aria-hidden="true">
                <i></i><i></i><i></i><i></i>
            </span>
            <span id="layer-quality-label">Datacompleetheid 2/3</span>
        </div>
    </div>
</div>



<div id="map"></div>

<div id="side-panel">
    <section id="feature-panel" aria-labelledby="feature-panel-title">
        <div id="feature-panel-title" class="panel-section-heading">Selected layer data</div>
        <div id="panel-content">
            <div class="placeholder-text">
                Select a map feature to inspect its data.
            </div>
        </div>
    </section>

    <section id="scenario-panel" class="sidebar-controls" aria-labelledby="scenario-panel-title">
        <div id="scenario-panel-title" class="panel-section-heading">Grid congestion scenario</div>
        <div id="scenario-target" class="scenario-target" data-state="empty">
            <span>Scenario target</span>
            <strong id="scenario-target-value">No PC6 selected</strong>
        </div>

        <div class="slider-unit">
            <div class="slider-header">
                <label class="slider-label" for="input-gas">Gas demand</label>
                <span class="slider-pct" id="pct-gas">100%</span>
            </div>
            <input type="range" class="side-slider" id="input-gas" min="0" max="100" value="100">
        </div>

        <div class="slider-unit">
            <div class="slider-header">
                <label class="slider-label" for="input-pv">PV adoption</label>
                <span class="slider-pct" id="pct-pv">100%</span>
            </div>
            <input type="range" class="side-slider" id="input-pv" min="100" max="500" value="100">
        </div>

        <button id="run-sim-btn" class="primary-btn" disabled>RUN SCENARIO</button>

        <div id="simulation-output" class="simulation-output" hidden>
            <div class="control-label">Simulation result</div>
            <div id="graph-container" class="scenario-graph">
                <span>Graph will render here...</span>
            </div>
            <a id="download-link" href="#" class="download-link">Download processed_data.csv</a>
        </div>
    </section>
</div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map-data.js"></script>
    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

<div id="chart-modal" style="display:none; position:fixed; z-index:10000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.9); backdrop-filter: blur(4px);">
    <div style="background:white; margin:2% auto; padding:30px; width:92%; height:85vh; border-radius:12px; position:relative; box-shadow: 0 20px 40px rgba(0,0,0,0.4);">
        
        <span id="close-modal-btn" style="position:absolute; right:20px; top:10px; cursor:pointer; font-size:32px; font-weight:bold; color:#333;">&times;</span>
        
        <div id="modal-graph-container" style="width:100%; height:100%;"></div>
    </div>
</div>
</div>
</body>

<svg style="height: 0; width: 0; position: absolute;">
  <defs>
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="4" height="8" fill="rgba(255,255,255,0.8)"></rect>
    </pattern>
  </defs>
</svg>
</html>
