services:

#  --------------------------------------- PLAYGROUND ---------------------------------------
  policy-tool-frontend:
      image: nginx@sha256:4c734d33ee731135dc9f2349914a34551c920f4451fca8bb05bf5880eb9079e8 # nginx:1.31.8-alpine-slim
      volumes:
        # Mount HTML/JS/CSS code
        - ./policy-tool-frontend:/usr/share/nginx/html/dashboard:ro
        # Mount the shared volume so Nginx can serve the generated CSVs
        - policy-tool-data:/usr/share/nginx/html/dashboard/processed
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/dashboard`)"
        - "traefik.http.routers.dashboard.entrypoints=web,websecure"
        - "traefik.http.routers.dashboard.tls=true"
        - "traefik.http.services.dashboard.loadbalancer.server.port=80"
      restart: always

  policy-tool-backend:
      build: ./policy-tool-backend
      volumes:
        - policy-tool-data:/app/data/processed
        - transformer-profile-cache:/app/data/transformer-profiles:ro
        - ./layer-publisher/layer-manifest.json:/app/config/layer-manifest.json:ro
        - ./policy-tool-frontend/data/alkmaar_energy_map.geojson:/app/config/alkmaar_energy_map.geojson:ro
      environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD}
        - LAYER_REGISTRY_PATH=/app/config/layer-manifest.json
        - PC6_GEOMETRY_PATH=/app/config/alkmaar_energy_map.geojson
        - GRID_API_URL=http://grid-api:8080
        - CONGESTION_API_URL=http://congestion-backend:8080
        - CONGESTION_REQUEST_TIMEOUT_SECONDS=120
        - CONSUMPTION_API_URL=http://consumption-api:8080
        - PV_API_URL=http://pv-api:8000
        - PV_EXPECTED_RELEASE_COMMIT=0d40dbfa6d30b96b01f1d4e633c13b42c654c1d0
        - PV_EXPECTED_CONTAINER_IMAGE=ghcr.io/jortgroen/pv-map-api@sha256:d35b73fc88dcdb959f8084ede6348e148039ab530282ac1e779a58f6129cf428
        - PV_EXPECTED_MODEL_VERSION=0.3.0
        - PV_REQUEST_TIMEOUT_SECONDS=120
        - TRANSFORMER_PROFILE_CACHE_PATH=/app/data/transformer-profiles/baseline-2023.json.gz
      depends_on:
        transformer-profile-init:
          condition: service_completed_successfully
          # Optional: a missing Grid snapshot must not keep the other models down.
          required: false
      labels:
        - "traefik.enable=true"
        # path to /policy-api is needed to out frontend to make calls to the backend
        - "traefik.http.routers.policy-router.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/policy-api`)"
        - "traefik.http.routers.policy-router.entrypoints=web,websecure"
        - "traefik.http.routers.policy-router.tls=true"
        # middleware needs to strip /policy-api so the Python code sees "/"
        - "traefik.http.middlewares.policy-strip.stripprefix.prefixes=/policy-api"
        - "traefik.http.routers.policy-router.middlewares=policy-strip"
        - "traefik.http.services.policy-service.loadbalancer.server.port=8000"
      restart: always

  ## -----------------------------------------------------------
  ## Initialize and expose the standalone PV capacity model API.
  ## -----------------------------------------------------------
  pv-init:
    <<: *pv-cache-image
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - pv-raw-cache:/app/data/raw
    restart: "no"

  pv-api:
    <<: *pv-image
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      PV_RAW_CACHE_DIR: /app/data/raw
      PV_MODEL_CONFIG_PATH: /app/config/pv_model.yaml
      PV_OUTPUT_DIR: /app/data/processed/pv_capacity
      PV_IMAGE_IDENTITY: ghcr.io/jortgroen/pv-map-api@sha256:d35b73fc88dcdb959f8084ede6348e148039ab530282ac1e779a58f6129cf428
    volumes:
      - pv-raw-cache:/app/data/raw:ro
      - pv-generated-outputs:/app/data/processed/pv_capacity
    depends_on:
      pv-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/ready', timeout=3); assert response.status == 200"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 20
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pv-api.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/models/pv`)"
      - "traefik.http.routers.pv-api.entrypoints=web,websecure"
      - "traefik.http.routers.pv-api.tls=true"
      - "traefik.http.middlewares.pv-api-strip.stripprefix.prefixes=/models/pv"
      - "traefik.http.routers.pv-api.middlewares=pv-api-strip"
      - "traefik.http.services.pv-api.loadbalancer.server.port=8000"
    restart: unless-stopped

  ## -------------------------------------------------------------
  ## Initialize and expose the standalone Liander grid model API.
  ## -------------------------------------------------------------
  grid-crosswalk-init:
    <<: *grid-crosswalk-image
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - grid-crosswalk-data:/crosswalk
    restart: "no"

  # Grid and congestion move (and roll back) together: congestion accepts grid
  # contract 2.9.0 only at the grid commits it names (congestion 8b4a335 accepts 9148f09 and a08f5ea).
  #
  # Since 2026-11-08 Liander's public service lacks the station attributes Grid needs
  # (liander-grid-model#41), so a live --fetch-region would build a rootless grid.
  # grid-init therefore builds from the retained 18 Aug snapshot, the source of the
  # previous cache (sha256 e7c9d609...). The capaciteitskaart comes from the document
  # stored by grid-capacity-refresh, so starting never depends on EDSN; without that
  # document the grid is built without the capacity layer. An identical request
  # reuses the ready cache.
  grid-init:
    <<: *grid-image
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    command:
      - sh
      - -c
      - |
        set -e
        set -- --source-gpkg /data/sources/liander-north-holland-towns.gpkg \
          --source-retrieved-at 2026-08-18T09:53:06.188727+00:00 \
          --pc6-geojson /crosswalk/alkmaar-cbs-postcode6-2024.geojson \
          --buurt-pc6-crosswalk /crosswalk/alkmaar-buurt-pc6-2025.json
        if [ -f /data/sources/capaciteitskaart.json ]; then
          set -- "$$@" --capaciteitskaart-source-cache /data/sources/capaciteitskaart.json
        else
          echo "grid-init: no stored capaciteitskaart; run grid-capacity-refresh to add it" >&2
        fi
        exec python -m grid_api initialize "$$@"
    environment:
      GRID_API_DATA_DIR: /data
      GRID_API_CONTAINER_DIGEST: sha256:7cab44fc8de4a764339490cb261af12dc2098c810dc6dc2a504786cc9dca98e0
    volumes:
      - grid-model-data:/data
      - grid-crosswalk-data:/crosswalk:ro
    depends_on:
      grid-crosswalk-init:
        condition: service_completed_successfully
    restart: "no"

  # Fetches the current EDSN capaciteitskaart (about 35 minutes for all PC6), stores it
  # as /data/sources/capaciteitskaart.json and keeps every version; a new version rebuilds
  # the cache. Run it on demand, with grid-api stopped, then start grid-api and restart
  # layer-publisher:
  #   docker compose stop grid-api
  #   docker compose --profile maintenance run --rm grid-capacity-refresh
  #   docker compose up -d grid-api && docker compose restart layer-publisher
  # An EDSN outage fails only this run; the stored version keeps serving.
  grid-capacity-refresh:
    <<: *grid-image
    profiles: ["maintenance"]
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    command:
      - python
      - -m
      - grid_api
      - initialize
      - --source-gpkg
      - /data/sources/liander-north-holland-towns.gpkg
      - --source-retrieved-at
      - "2026-08-18T09:53:06.188727+00:00"
      - --pc6-geojson
      - /crosswalk/alkmaar-cbs-postcode6-2024.geojson
      - --buurt-pc6-crosswalk
      - /crosswalk/alkmaar-buurt-pc6-2025.json
      - --fetch-capaciteitskaart
      - --capaciteitskaart-reference-period
      - "2026"
    environment:
      GRID_API_DATA_DIR: /data
      GRID_API_CONTAINER_DIGEST: sha256:7cab44fc8de4a764339490cb261af12dc2098c810dc6dc2a504786cc9dca98e0
    volumes:
      - grid-model-data:/data
      - grid-crosswalk-data:/crosswalk:ro
    restart: "no"

  grid-api:
    <<: *grid-image
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      GRID_API_DATA_DIR: /data
      GRID_API_CONTAINER_DIGEST: sha256:7cab44fc8de4a764339490cb261af12dc2098c810dc6dc2a504786cc9dca98e0
    volumes:
      - grid-model-data:/data
    depends_on:
      grid-init:
        condition: service_completed_successfully
        # Optional: a missing Grid snapshot must not keep the other models down.
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8080/ready', timeout=3); assert response.status == 200"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 20
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grid-api.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/models/grid`)"
      - "traefik.http.routers.grid-api.entrypoints=web,websecure"
      - "traefik.http.routers.grid-api.tls=true"
      - "traefik.http.middlewares.grid-api-strip.stripprefix.prefixes=/models/grid"
      - "traefik.http.routers.grid-api.middlewares=grid-api-strip"
      - "traefik.http.services.grid-api.loadbalancer.server.port=8080"
    restart: unless-stopped

  ## -------------------------------------------------------------
  ## Initialize and expose the standalone Wind turbine model API.
  ## -------------------------------------------------------------
  wind-init:
    <<: *wind-image
    user: "10001:10001"
    command:
      - python
      - -m
      - wind_turbine_map.api.initialize
      - --mode
      - real
    environment:
      WIND_API_DATA_DIR: /data
    volumes:
      - wind-model-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  wind-api:
    <<: *wind-image
    user: "10001:10001"
    environment:
      WIND_API_DATA_DIR: /data
    volumes:
      - wind-model-data:/data
    depends_on:
      wind-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8080/ready', timeout=3); assert response.status == 200"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 20
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.wind-api.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/models/wind`)"
      - "traefik.http.routers.wind-api.entrypoints=web,websecure"
      - "traefik.http.routers.wind-api.tls=true"
      - "traefik.http.middlewares.wind-api-strip.stripprefix.prefixes=/models/wind"
      - "traefik.http.routers.wind-api.middlewares=wind-api-strip"
      - "traefik.http.services.wind-api.loadbalancer.server.port=8080"
    restart: unless-stopped

  ## -------------------------------------------------------------
  ## Initialize and expose the standalone Heat network model API.
  ## -------------------------------------------------------------
  heat-init:
    <<: *heat-image
    user: "10001:10001"
    command:
      - python
      - -m
      - heat_net_map.api
      - initialize
      - --mode
      - real_source
      - --run-model
    volumes:
      - heat-model-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  heat-api:
    <<: *heat-image
    user: "10001:10001"
    volumes:
      - heat-model-data:/data
    depends_on:
      heat-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8080/ready', timeout=3); assert response.status == 200"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 30
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.heat-api.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/models/heat`)"
      - "traefik.http.routers.heat-api.entrypoints=web,websecure"
      - "traefik.http.routers.heat-api.tls=true"
      - "traefik.http.middlewares.heat-api-strip.stripprefix.prefixes=/models/heat"
      - "traefik.http.routers.heat-api.middlewares=heat-api-strip"
      - "traefik.http.services.heat-api.loadbalancer.server.port=8080"
    restart: unless-stopped

  ## ----------------------------------------------------------------
  ## Aggregate model profiles over explicit Grid assignments.
  ## ----------------------------------------------------------------
  congestion-backend:
    <<: *congestion-image
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      CONGESTION_ADAPTER_MODE: http
      GRID_API_BASE_URL: http://grid-api:8080
      CONSUMPTION_API_BASE_URL: http://consumption-api:8080
      PV_API_BASE_URL: http://pv-api:8000
      PV_API_TIMEOUT_SECONDS: "120"
      PV_EXPECTED_RELEASE_COMMIT: 0d40dbfa6d30b96b01f1d4e633c13b42c654c1d0
      PV_EXPECTED_CONTAINER_IMAGE: ghcr.io/jortgroen/pv-map-api@sha256:d35b73fc88dcdb959f8084ede6348e148039ab530282ac1e779a58f6129cf428
      PV_EXPECTED_MODEL_VERSION: 0.3.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8080/ready', timeout=3); assert response.status == 200"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 20
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.congestion-api.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/models/congestion`)"
      - "traefik.http.routers.congestion-api.entrypoints=web,websecure"
      - "traefik.http.routers.congestion-api.tls=true"
      - "traefik.http.middlewares.congestion-api-strip.stripprefix.prefixes=/models/congestion"
      - "traefik.http.routers.congestion-api.middlewares=congestion-api-strip"
      - "traefik.http.services.congestion-api.loadbalancer.server.port=8080"
    restart: unless-stopped

  ## -----------------------------------------------------
  ## Expose the standalone public EV charging model API.
  ## -----------------------------------------------------
  ev-api:
    <<: *ev-image
    init: true
    environment:
      EV_RELEASE_COMMIT: 8a904634308bf59d0271cd0a8a2e8310fab00239
      EV_IMAGE_IDENTITY: ghcr.io/jortgroen/ev-map-api@sha256:ef9731817df61324e0613fa3b03957bdb0cc93f9d07b6f86e30f0a0cfc6a839c
      EV_OUTPUT_DIR: /var/lib/ev-map/outputs
    volumes:
      - ev-generated-outputs:/var/lib/ev-map/outputs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/ready', timeout=3); assert response.status == 200"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 20
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ev-api.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/models/ev`)"
      - "traefik.http.routers.ev-api.entrypoints=web,websecure"
      - "traefik.http.routers.ev-api.tls=true"
      - "traefik.http.middlewares.ev-api-strip.stripprefix.prefixes=/models/ev"
      - "traefik.http.routers.ev-api.middlewares=ev-api-strip"
      - "traefik.http.services.ev-api.loadbalancer.server.port=8000"
    restart: unless-stopped

  ## --------------------------------------------------------------------
  ## Initialize and expose the standalone annual Consumption Map API.
  ## --------------------------------------------------------------------
  consumption-source-cache-init:
    <<: *consumption-cache-image
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - consumption-model-data:/var/lib/consumption-map
    restart: "no"

  consumption-runtime-init:
    <<: *consumption-image
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    entrypoint:
      - python
      - -m
      - consumption_map.rdp_cli
    command:
      - initialize
      - --source
      - /var/lib/consumption-map/bootstrap/consumption-source-cache-alkmaar-2023.zip
      - --data-root
      - /var/lib/consumption-map
    depends_on:
      consumption-source-cache-init:
        condition: service_completed_successfully
    volumes:
      - consumption-model-data:/var/lib/consumption-map
    restart: "no"

  consumption-api:
    <<: *consumption-image
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CONSUMPTION_CONTAINER_IMAGE: ghcr.io/jortgroen/consumption-map-api@sha256:67da0c9b1a44bfc5d72ec32133dc0080a478990cf9ef3b542953cb69080b567e
    depends_on:
      consumption-runtime-init:
        condition: service_completed_successfully
    volumes:
      - consumption-model-data:/var/lib/consumption-map
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8080/readyz', timeout=3); assert response.status == 200"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 20
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.consumption-api.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/models/consumption`)"
      - "traefik.http.routers.consumption-api.entrypoints=web,websecure"
      - "traefik.http.routers.consumption-api.tls=true"
      - "traefik.http.middlewares.consumption-api-strip.stripprefix.prefixes=/models/consumption"
      - "traefik.http.routers.consumption-api.middlewares=consumption-api-strip"
      - "traefik.http.services.consumption-api.loadbalancer.server.port=8080"
    restart: unless-stopped

  transformer-profile-init:
      # Same image as policy-tool-backend, so a rebuild of the backend also updates
      # the baseline code (a separately named image went stale for weeks).
      image: illuminator-dev-policy-tool-backend
      build: ./policy-tool-backend
      command:
        - python
        - -m
        - profile_cache_init
        - --output
        - /app/data/transformer-profiles/baseline-2023.json.gz
        - --consumption-root
        - /model-data/consumption
        - --grid-url
        - http://grid-api:8080
        - --pv-url
        - http://pv-api:8000
        - --reuse-ready-cache
      volumes:
        - transformer-profile-cache:/app/data/transformer-profiles
        - consumption-model-data:/model-data/consumption:ro
      depends_on:
        consumption-api:
          condition: service_healthy
        grid-api:
          condition: service_healthy
          # Optional: a missing Grid snapshot must not keep the other models down.
          required: false
        pv-api:
          condition: service_healthy
      restart: "no"

#  ------------------------------------END OF PLAYGROUND -------------------------------------


  ## -----------------------------------------------------------------
  ## Use Redis streams for data access of micro-services in real-time.
  ## -----------------------------------------------------------------
  redis:
    image: redis@sha256:82403a0812a51faf6779f8d0dbe25ea85279ec7d49d24a3c78a65e9d8a87fa5f # redis:7.2.17-alpine, build of 2026-11-09
    # The password is written to a config file at start instead of being passed
    # as a command-line argument, which any user on the host can read with `ps`.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set to a non-empty value}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        umask 077
        [ -n "$$REDIS_PASSWORD" ] || { echo "REDIS_PASSWORD is empty" >&2; exit 1; }
        nl=$$(printf '\nx'); nl=$${nl%x}; cr=$$(printf '\rx'); cr=$${cr%x}
        case "$$REDIS_PASSWORD" in
          *"$$nl"*|*"$$cr"*)
            echo "REDIS_PASSWORD must not contain a line break" >&2; exit 1;;
        esac
        # Inside a quoted Redis directive a backslash and a double quote are
        # escape characters, so escape them to store the password literally.
        esc=$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/\\/\\\\/g; s/"/\\"/g')
        [ -n "$$esc" ] || { echo "could not encode REDIS_PASSWORD" >&2; exit 1; }
        # A restart reuses the container filesystem: the old file belongs to redis and
        # the kernel (fs.protected_regular) refuses root to overwrite it in sticky /tmp.
        rm -f /tmp/redis.conf
        printf 'requirepass "%s"\n' "$$esc" > /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        exec docker-entrypoint.sh redis-server /tmp/redis.conf
    volumes:
      - redis-data:/data
    restart: always

  ## -----------------------------------------------
  ## This micro-service retrieves weather forecasts.
  ## -----------------------------------------------
  weather-data-service:
    build: weather-data-service
    volumes:
      - ./weather-data-service/config.yml:/etc/data_crawler/config.yml:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    restart: always

  ## ----------------------------------------------------------
  ## Use TimescaleDB for permanent storage of time series data.
  ## ----------------------------------------------------------
  timescale:
    # PostgreSQL 17 with TimescaleDB 2.31 and PostGIS 3.6 (digest-pinned; the pg14-latest tag has not
    # been rebuilt since April 2023). Data lives in the timescale-pg17-data volume; the old
    # timescale-data volume is kept untouched for rollback.
    image: &timescale-image timescale/timescaledb-ha@sha256:3f0b3f6bdf4912878444a36e6113a18346309583c4d1a61d81a0c511342a1afd
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      TIMESCALEDB_TELEMETRY: "off"
    depends_on:
      timescale-guard:
        condition: service_completed_successfully
    volumes:
      # The timescaledb-ha image keeps PGDATA under /home/postgres/pgdata (not
      # /var/lib/postgresql/data), so the volume must be mounted there or the
      # database lives in the container's writable layer and is lost when the
      # container is recreated.
      - timescale-pg17-data:/home/postgres/pgdata
    restart: always
    ports:
      - "127.0.0.1:5432:5432"  # local diagnostics or an SSH tunnel only

  ## ------------------------------------------------------------------------------
  ## Fails closed: refuses to start the PostgreSQL 17 database on an empty volume when
  ## a PostgreSQL 14 database exists (see docs/rdp-deployment-runbook.md).
  ## ------------------------------------------------------------------------------
  timescale-guard:
    image: *timescale-image
    user: root
    entrypoint: ["sh", "/guard.sh"]
    environment:
      TIMESCALE_ALLOW_EMPTY_PG17: ${TIMESCALE_ALLOW_EMPTY_PG17:-}
    volumes:
      - ./scripts/timescale-upgrade-guard.sh:/guard.sh:ro
      - timescale-data:/old:ro
      - timescale-pg17-data:/new:ro
    restart: "no"

  ## ------------------------------------------------------------------------
  ## This micro-service defines the database schema used by the timescale DB.
  ## ------------------------------------------------------------------------
  db-scheme:
    image: ait1/rdp-database:latest-dev
    depends_on:
      - timescale
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DATA_SOURCE_USER: ${POSTGRES_DATA_SOURCE_USER}
      POSTGRES_DATA_SOURCE_PASSWORD: ${POSTGRES_DATA_SOURCE_PASSWORD}
      POSTGRES_DATA_VIS_USER: ${POSTGRES_DATA_VIS_USER}
      POSTGRES_DATA_VIS_PASSWORD: ${POSTGRES_DATA_VIS_PASSWORD}
      POSTGRES_DATA_PUB_VIS_USER: ${POSTGRES_DATA_PUB_VIS_USER}
      POSTGRES_DATA_PUB_VIS_PASSWORD: ${POSTGRES_DATA_PUB_VIS_PASSWORD}
      RDP_POSTGRES_HOST: timescale

  ## ----------------------------------------------------------------------------------
  ## This micro-service stores selected data from the Redis stream to the TtimescaleDB.
  ## ----------------------------------------------------------------------------------
  data-sync-service:
    build: ./images/redsql
    image: illuminator-dev-redsql:latest
    environment:
      POSTGRES_USER: ${POSTGRES_DATA_SOURCE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DATA_SOURCE_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./data-sync-service/config.yml:/etc/redsql/config.yml:ro
    depends_on:
      redis:
        condition: service_started
      db-scheme:
        condition: service_completed_successfully
    restart: always
    ## Expose ports only for debugging.
    # ports:
    #  - "5432:5432"

  ## ----------------------------------------------------------
  ## Use grafana for visualization of data in the timescale DB.
  ## ----------------------------------------------------------
  grafana:
    image: grafana/grafana@sha256:9b031995a5483a44f80a5dd214a70cecb31448b42d765b44d3756e17b855775f # 13.0.13 (grafana/grafana is the OSS image; grafana-oss gets no updates since 13.0.2)
    environment:
      # Not published through Traefik (the dashboard does not use Grafana).
      # Use it through an SSH tunnel: ssh -L 3300:127.0.0.1:3300 <server>, then
      # http://localhost:3300/grafana/
      GF_SERVER_ROOT_URL: "http://localhost:3300/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      POSTGRES_DATA_VIS_USER: ${POSTGRES_DATA_VIS_USER}
      POSTGRES_DATA_VIS_PASSWORD: ${POSTGRES_DATA_VIS_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      db-scheme:
        condition: service_completed_successfully
    restart: always
    ports:
      - "127.0.0.1:3300:3000"  # local access or an SSH tunnel only
    labels:
      # The route stays defined so the local override can switch it on (traefik.enable).
      - "traefik.enable=false"
      - "traefik.http.routers.grafana.rule=HostRegexp(`reformers01.ewi.tudelft.nl`) && (Path(`/grafana`) || PathPrefix(`/grafana/`))"
      - "traefik.http.routers.grafana.service=service-grafana"
      - "traefik.http.services.service-grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.entrypoints=web,websecure"
      - "traefik.http.routers.grafana.tls=true"

  ## ------------------------------------------------------------------------------------
  ## This micro-service uses the latest forecast data for running a PV module simulation.
  ## ------------------------------------------------------------------------------------
  pv-sim-service:
    build: pv-sim-service
    volumes:
      - ./pv-sim-service/config.yml:/app/config.yml:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - weather-data-service
    restart: always

  ## -----------------------------------------------
  ## This micro-service retrieves weather forecasts.
  ## -----------------------------------------------
  frequency-data-service:
    build: frequency-data-service
    volumes:
      - ./frequency-data-service/config.yml:/etc/data_crawler/config.yml:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    restart: always

  ## ------------------------------------------------------------------------------------
  ## This micro-service uses the latest forecast data for running a illuminator simulation.
  ## ------------------------------------------------------------------------------------
  illuminator-service:
    build: illuminator-service
    volumes:
      - ./illuminator-service/config.yml:/app/config.yml:ro
      - ./illuminator-output:/app/output
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - weather-data-service
    restart: always


  ## --------------------------------------------------
  ## Use a reverse proxy to secure this RDP deployment.
  ## --------------------------------------------------
  reverse-proxy:
    image: traefik@sha256:c1ea95f3b3eab04ba8868d201b8494e12284e424f7cec2127e3194bca1c6641c # traefik v3.7.18
    user: root
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs/config.yml:/etc/traefik/dynamic_conf.yml:ro
      - ${PATH_TO_CERT_FILE}:/etc/traefik/certs/reformers01.ewi.tudelft.nl.crt:ro
      - ${PATH_TO_KEY_FILE}:/etc/traefik/certs/reformers01.ewi.tudelft.nl.key:ro
    restart: always
    command:
      - "--log.level=INFO"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.watch=true"
      - "--providers.file.filename=/etc/traefik/dynamic_conf.yml"
      - "--providers.docker=true"
      # The Traefik API/dashboard is only enabled in docker-compose.local.yml.

  # ## -------------------------------------------------- 
  # ## Expose the WFS API through the reverse proxy. This container is for static publishing a static WFS file.
  # ## Accessible at: http://localhost/wfs and https://localhost/wfs
  # ## --------------------------------------------------
  # wfs-api:
  #   build: ./api
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.wfs.rule=HostRegexp(`localhost`) && (Path(`/wfs`) || PathPrefix(`/wfs/`))"
  #     - "traefik.http.routers.wfs.entrypoints=web,websecure"
  #     - "traefik.http.routers.wfs.tls=true"
  #     - "traefik.http.routers.wfs.service=service-wfs"
  #     - "traefik.http.services.service-wfs.loadbalancer.server.port=8000"

  #   depends_on:
  #     - reverse-proxy

  ## --------------------------------------------------
  ## Setup GeoServer API through the reverse proxy.
  ## Accessible at: http://localhost/geoserver and https://localhost/geoserver
  ## --------------------------------------------------
  geo:
    # Official GeoServer image (same 3.0.2 release as the former kartoza image, current OS packages).
    # PostGIS stores and SLD styles are part of the core, so no extensions are installed.
    image: docker.osgeo.org/geoserver@sha256:5a372d4988116e8f62c71ae5ff6eb8d433967697670fb1dec15379bf476721fe # 3.0.2
    environment:
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER:?set GEOSERVER_ADMIN_USER in .env}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD in .env}
      - SKIP_DEMO_DATA=true
      # Run as the uid/gid that owns ./geo (the former kartoza user).
      - RUN_UNPRIVILEGED=true
      - RUN_WITH_USER_UID=2000
      - RUN_WITH_USER_GID=2000
      # Same heap, axis order and date encoding as before; static web files stay disabled.
      - >-
        EXTRA_JAVA_OPTS=-Xms2G -Xmx4G
        -Dorg.geotools.referencing.forceXY=true
        -Dorg.geotools.localDateTimeHandling=true
        -Duser.timezone=GMT -Dfile.encoding=UTF8
        -DGEOSERVER_DISABLE_STATIC_WEB_FILES=true
        -DGEOSERVER_FEATUREINFO_HTML_SCRIPT=SELF
    # A fresh checkout has geo/security without its untracked secrets (keystore, master
    # password). The official image only bootstraps security when the directory is absent,
    # so such an incomplete copy is moved aside (not deleted). A deployed data dir has the
    # secrets and is left alone.
    entrypoint:
      - bash
      - -c
      - |
        d=/opt/geoserver_data/security
        if [ -d "$$d" ] && [ ! -f "$$d/masterpw/default/passwd" ] && [ ! -f "$$d/geoserver.jceks" ]; then
          mv "$$d" "/opt/geoserver_data/security.incomplete-$$(date +%s)"
          echo "geo: moved an incomplete security directory aside; GeoServer creates a new one"
        fi
        exec bash /opt/startup.sh
    volumes:
      - ./geo:/opt/geoserver_data  # persistent config (data lives in PostGIS)
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geoserver.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/geoserver`)"
      - "traefik.http.routers.geoserver.entrypoints=web,websecure"
      - "traefik.http.routers.geoserver.tls=true"
      - "traefik.http.routers.geoserver.service=service-geoserver"
      - "traefik.http.services.service-geoserver.loadbalancer.server.port=8080"
  
  ## --------------------------------------------------
  ## Pushes layer to  GeoServer through the same network.
  ## --------------------------------------------------
  layer-publisher:
    build: ./layer-publisher
    environment:
      GEOSERVER_REST_URL: http://geo:8080/geoserver/rest
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:?set GEOSERVER_ADMIN_USER in .env}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD in .env}
      POSTGRES_HOST: timescale
      POSTGRES_PORT: 5432
      POSTGRES_DB: rdp_db
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      # GeoServer reads the layer tables with this read-only role (the publisher creates
      # it and grants SELECT on the layer tables only); it must not be the admin user.
      GEOSERVER_DB_USER: ${GEOSERVER_DB_READER_USER:?set GEOSERVER_DB_READER_USER in .env}
      GEOSERVER_DB_PASSWORD: ${GEOSERVER_DB_READER_PASSWORD:?set GEOSERVER_DB_READER_PASSWORD in .env}
      PUBLISHER_MANIFEST_PATH: /app/layer-manifest.json
      PC6_SOURCE_PATH: /data/alkmaar_energy_map.geojson
      PV_API_URL: http://pv-api:8000
      PV_EXPECTED_RELEASE_COMMIT: 0d40dbfa6d30b96b01f1d4e633c13b42c654c1d0
      PV_EXPECTED_CONTAINER_IMAGE: ghcr.io/jortgroen/pv-map-api@sha256:d35b73fc88dcdb959f8084ede6348e148039ab530282ac1e779a58f6129cf428
      GRID_API_URL: http://grid-api:8080
      GRID_EXPECTED_RELEASE_COMMIT: a08f5eade2a94ee0b82e6682632c704fb4740ac4
      GRID_EXPECTED_CONTAINER_DIGEST: sha256:7cab44fc8de4a764339490cb261af12dc2098c810dc6dc2a504786cc9dca98e0
      GRID_EXPECTED_DATA_MODE: real_source
      # Publish grid_capacity_limits whenever Grid offers it; without a stored
      # capaciteitskaart the other grid layers are still published (with a warning).
      GRID_REQUIRE_CAPACITY: "false"
      GRID_EXPORT_BBOX: 4.60,52.50,4.98,52.88
      WIND_API_URL: http://wind-api:8080
      WIND_EXPECTED_RELEASE_COMMIT: 91d7443094aa0bb4fecdbcac975fa06b6ea617b0
      WIND_EXPECTED_CONTAINER_IMAGE: ghcr.io/jortgroen/wind-turbine-map-api:sha-91d7443094aa0bb4fecdbcac975fa06b6ea617b0
      WIND_EXPECTED_CONTAINER_DIGEST: sha256:66f97333bea9ab3cce5d6704abee4a408086cf75ed55f05e86382decadc51419
      WIND_EXPECTED_DATA_MODE: real_source
      HEAT_API_URL: http://heat-api:8080
      HEAT_EXPECTED_RELEASE_COMMIT: ac539d15d142aa0f6c997c0ae8fdd35a2b96dcb1
      HEAT_EXPECTED_CONTAINER_DIGEST: sha256:a69ee37e4858f4cf4b80b47aa832effcc1ab3b2c25d310e05a3eefa0ae64fe64
      HEAT_EXPECTED_DATA_MODE: real_source
      EV_API_URL: http://ev-api:8000
      EV_EXPECTED_RELEASE_COMMIT: 8a904634308bf59d0271cd0a8a2e8310fab00239
      EV_EXPECTED_CONTAINER_IMAGE: ghcr.io/jortgroen/ev-map-api@sha256:ef9731817df61324e0613fa3b03957bdb0cc93f9d07b6f86e30f0a0cfc6a839c
      CONSUMPTION_API_URL: http://consumption-api:8080
      CONSUMPTION_EXPECTED_RELEASE_COMMIT: c1baad4e87e189e495c2ec40654b79c67ed4acab
      CONSUMPTION_EXPECTED_CONTAINER_IMAGE: ghcr.io/jortgroen/consumption-map-api@sha256:67da0c9b1a44bfc5d72ec32133dc0080a478990cf9ef3b542953cb69080b567e
      GEOSERVER_WORKSPACE: rdp
      GEOSERVER_DATASTORE: rdp_postgis
      PUBLISH_INTERVAL_SECONDS: 10
      PUBLISH_MODELS: ${PUBLISH_MODELS:-}
    depends_on:
      geo:
        condition: service_started
      timescale:
        condition: service_started
      db-scheme:
        condition: service_completed_successfully
      pv-api:
        condition: service_healthy
      grid-api:
        condition: service_healthy
        # Optional: a missing Grid snapshot must not keep the other models down.
        required: false
      wind-api:
        condition: service_healthy
      heat-api:
        condition: service_healthy
      ev-api:
        condition: service_healthy
      consumption-api:
        condition: service_healthy
    networks:
      - default
    volumes:
      - ./policy-tool-frontend/data/alkmaar_energy_map.geojson:/data/alkmaar_energy_map.geojson:ro
    restart: unless-stopped

  ## ---------------------------------------------------------------------------------
  ## For debugging: use Redis Insight browser to explore the content of redis streams.
  ## ---------------------------------------------------------------------------------
  redis-insight:
    image: redis/redisinsight@sha256:b5e19ee240abef6edb435871b90ff8a210995422e8e018ab61c0339d318a1f84 # 3.8.0
    restart: always
    environment:
      - RI_REDIS_HOST0=redis
      - RI_REDIS_PORT0=6379
      - RI_REDIS_PASSWORD0=${REDIS_PASSWORD}
      - RI_REDIS_ALIAS0=Tutorial Redis Database
    ports:
      - "127.0.0.1:5540:5540"
    depends_on:
      - redis


volumes:
  redis-data:
  timescale-data:  # PostgreSQL 14 data, kept for rollback only
  timescale-pg17-data:
  grafana-data:
  volumes:
  policy-tool-data:
  transformer-profile-cache:
  pv-raw-cache:
  pv-generated-outputs:
  grid-crosswalk-data:
  grid-model-data:
  wind-model-data:
  heat-model-data:
  ev-generated-outputs:
  consumption-model-data:
