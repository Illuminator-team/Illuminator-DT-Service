x-pv-image: &pv-image
  image: ghcr.io/jortgroen/pv-map-api@sha256:d561cb0defef3872c97e348f3c7490cbbdf6f6b810675f7dfa01495ce980feb9

services:

#  --------------------------------------- PLAYGROUND ---------------------------------------
  policy-tool-frontend:
      image: nginx:alpine
      volumes:
        # Mount HTML/JS/CSS code
        - ./policy-tool-frontend:/usr/share/nginx/html/dashboard:ro
        # Mount the shared volume so Nginx can serve the generated CSVs
        - policy-tool-data:/usr/share/nginx/html/dashboard/processed
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.dashboard.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/dashboard`)"
        - "traefik.http.routers.dashboard.entrypoints=web,websecure"
        - "traefik.http.routers.dashboard.tls=true"
        - "traefik.http.services.dashboard.loadbalancer.server.port=80"
      restart: unless-stopped

  policy-tool-backend:
      build: ./policy-tool-backend
      volumes:
        - policy-tool-data:/app/data/processed
        - ./layer-publisher/layer-manifest.json:/app/config/layer-manifest.json:ro
      environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD}
        - LAYER_REGISTRY_PATH=/app/config/layer-manifest.json
      labels:
        - "traefik.enable=true"
        # path to /policy-api is needed to out frontend to make calls to the backend
        - "traefik.http.routers.policy-router.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/policy-api`)"
        - "traefik.http.routers.policy-router.entrypoints=web,websecure"
        - "traefik.http.routers.policy-router.tls=true"
        # middleware needs to strip /policy-api so the Python code sees "/"
        - "traefik.http.middlewares.policy-strip.stripprefix.prefixes=/policy-api"
        - "traefik.http.routers.policy-router.middlewares=policy-strip"
        - "traefik.http.services.policy-service.loadbalancer.server.port=8000"

  ## -----------------------------------------------------------
  ## Initialize and expose the standalone PV capacity model API.
  ## -----------------------------------------------------------
  pv-init:
    <<: *pv-image
    command: ["python", "-m", "pv_map.api.initialize"]
    environment:
      PV_RAW_CACHE_DIR: /app/data/raw
      PV_MODEL_CONFIG_PATH: /app/config/pv_model.yaml
      PV_IMAGE_IDENTITY: ghcr.io/jortgroen/pv-map-api@sha256:d561cb0defef3872c97e348f3c7490cbbdf6f6b810675f7dfa01495ce980feb9
    volumes:
      - pv-raw-cache:/app/data/raw
    restart: "no"

  pv-api:
    <<: *pv-image
    environment:
      PV_RAW_CACHE_DIR: /app/data/raw
      PV_MODEL_CONFIG_PATH: /app/config/pv_model.yaml
      PV_OUTPUT_DIR: /app/data/processed/pv_capacity
      PV_IMAGE_IDENTITY: ghcr.io/jortgroen/pv-map-api@sha256:d561cb0defef3872c97e348f3c7490cbbdf6f6b810675f7dfa01495ce980feb9
    volumes:
      - pv-raw-cache:/app/data/raw
      - pv-generated-outputs:/app/data/processed/pv_capacity
    depends_on:
      pv-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; response = urlopen('http://127.0.0.1:8000/ready', timeout=3); assert response.status == 200"
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 20
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pv-api.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/models/pv`)"
      - "traefik.http.routers.pv-api.entrypoints=web,websecure"
      - "traefik.http.routers.pv-api.tls=true"
      - "traefik.http.middlewares.pv-api-strip.stripprefix.prefixes=/models/pv"
      - "traefik.http.routers.pv-api.middlewares=pv-api-strip"
      - "traefik.http.services.pv-api.loadbalancer.server.port=8000"
    restart: unless-stopped

#  ------------------------------------END OF PLAYGROUND -------------------------------------


  ## -----------------------------------------------------------------
  ## Use Redis streams for data access of micro-services in real-time.
  ## -----------------------------------------------------------------
  redis:
    image: "redis:7.2.4-alpine"
    command: >
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped

  ## -----------------------------------------------
  ## This micro-service retrieves weather forecasts.
  ## -----------------------------------------------
  weather-data-service:
    build: weather-data-service
    volumes:
      - ./weather-data-service/config.yml:/etc/data_crawler/config.yml:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    restart: unless-stopped

  ## ----------------------------------------------------------
  ## Use TimescaleDB for permanent storage of time series data.
  ## ----------------------------------------------------------
  timescale:
    image: "timescale/timescaledb-ha:pg14-latest" # Use this version for GIS support
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - 5432:5432  # only for debugging

  ## ------------------------------------------------------------------------
  ## This micro-service defines the database schema used by the timescale DB.
  ## ------------------------------------------------------------------------
  db-scheme:
    image: ait1/rdp-database:latest-dev
    depends_on:
      - timescale
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DATA_SOURCE_USER: ${POSTGRES_DATA_SOURCE_USER}
      POSTGRES_DATA_SOURCE_PASSWORD: ${POSTGRES_DATA_SOURCE_PASSWORD}
      POSTGRES_DATA_VIS_USER: ${POSTGRES_DATA_VIS_USER}
      POSTGRES_DATA_VIS_PASSWORD: ${POSTGRES_DATA_VIS_PASSWORD}
      POSTGRES_DATA_PUB_VIS_USER: ${POSTGRES_DATA_PUB_VIS_USER}
      POSTGRES_DATA_PUB_VIS_PASSWORD: ${POSTGRES_DATA_PUB_VIS_PASSWORD}
      RDP_POSTGRES_HOST: timescale

  ## ----------------------------------------------------------------------------------
  ## This micro-service stores selected data from the Redis stream to the TtimescaleDB.
  ## ----------------------------------------------------------------------------------
  data-sync-service:
    image: ait1/rdp-redsql:latest-dev
    environment:
      POSTGRES_USER: ${POSTGRES_DATA_SOURCE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_DATA_SOURCE_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./data-sync-service/config.yml:/etc/redsql/config.yml:ro
    depends_on:
      redis:
        condition: service_started
      db-scheme:
        condition: service_completed_successfully
    restart: unless-stopped
    ## Expose ports only for debugging.
    # ports:
    #  - "5432:5432"

  ## ----------------------------------------------------------
  ## Use grafana for visualization of data in the timescale DB.
  ## ----------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:10.2.3
    environment:
      GF_SERVER_ROOT_URL: "https://%(domain)s:443/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      POSTGRES_DATA_VIS_USER: ${POSTGRES_DATA_VIS_USER}
      POSTGRES_DATA_VIS_PASSWORD: ${POSTGRES_DATA_VIS_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      db-scheme:
        condition: service_completed_successfully
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=HostRegexp(`reformers01.ewi.tudelft.nl`) && (Path(`/grafana`) || PathPrefix(`/grafana/`))"
      - "traefik.http.routers.grafana.service=service-grafana"
      - "traefik.http.services.service-grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.entrypoints=web,websecure"
      - "traefik.http.routers.grafana.tls=true"

  ## ------------------------------------------------------------------------------------
  ## This micro-service uses the latest forecast data for running a PV module simulation.
  ## ------------------------------------------------------------------------------------
  pv-sim-service:
    build: pv-sim-service
    volumes:
      - ./pv-sim-service/config.yml:/app/config.yml:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - weather-data-service
    restart: unless-stopped

  ## -----------------------------------------------
  ## This micro-service retrieves weather forecasts.
  ## -----------------------------------------------
  frequency-data-service:
    build: frequency-data-service
    volumes:
      - ./frequency-data-service/config.yml:/etc/data_crawler/config.yml:ro
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    restart: unless-stopped

  ## ------------------------------------------------------------------------------------
  ## This micro-service uses the latest forecast data for running a illuminator simulation.
  ## ------------------------------------------------------------------------------------
  illuminator-service:
    build: illuminator-service
    volumes:
      - ./illuminator-service/config.yml:/app/config.yml:ro
      - ./illuminator-output:/app/output
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - weather-data-service
    restart: unless-stopped


  ## --------------------------------------------------
  ## Use a reverse proxy to secure this RDP deployment.
  ## --------------------------------------------------
  reverse-proxy:
    image: traefik:v3.6
    user: root
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"  # expose dashboard port
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs/config.yml:/etc/traefik/dynamic_conf.yml:ro
      - ${PATH_TO_CERT_FILE}:/etc/traefik/certs/reformers01.ewi.tudelft.nl.crt:ro
      - ${PATH_TO_KEY_FILE}:/etc/traefik/certs/reformers01.ewi.tudelft.nl.key:ro

  
    restart: on-failure
    command:
      - "--log.level=INFO"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=websecure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.websecure.address=:443"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.watch=true"
      - "--providers.file.filename=/etc/traefik/dynamic_conf.yml"
      - "--providers.docker=true"
      - "--api.insecure=true"  # enable Traefik dashboard
      - "--api.dashboard=true" # explicitly enable dashboard (safe to add)

  # ## -------------------------------------------------- 
  # ## Expose the WFS API through the reverse proxy. This container is for static publishing a static WFS file.
  # ## Accessible at: http://localhost/wfs and https://localhost/wfs
  # ## --------------------------------------------------
  # wfs-api:
  #   build: ./api
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.wfs.rule=HostRegexp(`localhost`) && (Path(`/wfs`) || PathPrefix(`/wfs/`))"
  #     - "traefik.http.routers.wfs.entrypoints=web,websecure"
  #     - "traefik.http.routers.wfs.tls=true"
  #     - "traefik.http.routers.wfs.service=service-wfs"
  #     - "traefik.http.services.service-wfs.loadbalancer.server.port=8000"

  #   depends_on:
  #     - reverse-proxy

  ## --------------------------------------------------
  ## Setup GeoServer API through the reverse proxy.
  ## Accessible at: http://localhost/geoserver and https://localhost/geoserver
  ## --------------------------------------------------
  geo:
    image: kartoza/geoserver:latest
    environment:
      - STABLE_EXTENSIONS=postgis-plugin
      - GEOSERVER_ADMIN_USER=${GEOSERVER_ADMIN_USER:?set GEOSERVER_ADMIN_USER in .env}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD in .env}
    volumes:
      - ./geo:/opt/geoserver/data_dir  # optional: persistent config/data
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.geoserver.rule=Host(`reformers01.ewi.tudelft.nl`) && PathPrefix(`/geoserver`)"
      - "traefik.http.routers.geoserver.entrypoints=web,websecure"
      - "traefik.http.routers.geoserver.tls=true"
      - "traefik.http.routers.geoserver.service=service-geoserver"
      - "traefik.http.services.service-geoserver.loadbalancer.server.port=8080"
  
  ## --------------------------------------------------
  ## Pushes layer to  GeoServer through the same network.
  ## --------------------------------------------------
  layer-publisher:
    build: ./layer-publisher
    environment:
      GEOSERVER_REST_URL: http://geo:8080/geoserver/rest
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:?set GEOSERVER_ADMIN_USER in .env}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD in .env}
      POSTGRES_HOST: timescale
      POSTGRES_PORT: 5432
      POSTGRES_DB: rdp_db
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      PUBLISHER_MANIFEST_PATH: /app/layer-manifest.json
      PC6_SOURCE_PATH: /data/alkmaar_energy_map.geojson
      PV_API_URL: http://pv-api:8000
      PV_EXPECTED_RELEASE_COMMIT: d9cd7920108d76b7d645c22b33d8cf26c35fc040
      PV_EXPECTED_CONTAINER_IMAGE: ghcr.io/jortgroen/pv-map-api@sha256:d561cb0defef3872c97e348f3c7490cbbdf6f6b810675f7dfa01495ce980feb9
      GEOSERVER_WORKSPACE: rdp
      GEOSERVER_DATASTORE: rdp_postgis
      PUBLISH_INTERVAL_SECONDS: 10
    depends_on:
      geo:
        condition: service_started
      timescale:
        condition: service_started
      db-scheme:
        condition: service_completed_successfully
      pv-api:
        condition: service_healthy
    networks:
      - default
    volumes:
      - ./policy-tool-frontend/data/alkmaar_energy_map.geojson:/data/alkmaar_energy_map.geojson:ro
    restart: unless-stopped

  ## ---------------------------------------------------------------------------------
  ## For debugging: use Redis Insight browser to explore the content of redis streams.
  ## ---------------------------------------------------------------------------------
  redis-insight:
    image: redis/redisinsight
    restart: unless-stopped
    environment:
      - RI_REDIS_HOST0=redis
      - RI_REDIS_PORT0=6379
      - RI_REDIS_PASSWORD0=${REDIS_PASSWORD}
      - RI_REDIS_ALIAS0=Tutorial Redis Database
    ports:
      - 5540:5540
    depends_on:
      - redis


volumes:
  redis-data:
  timescale-data:
  grafana-data:
  volumes:
  policy-tool-data:
  pv-raw-cache:
  pv-generated-outputs:
