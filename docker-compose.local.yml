services:
  policy-tool-frontend:
    labels:
      traefik.http.routers.dashboard.rule: (Host(`localhost`) || Host(`127.0.0.1`) || Host(`illuminator.localhost`)) && PathPrefix(`/dashboard`)
      traefik.http.routers.dashboard.entrypoints: web
      traefik.http.routers.dashboard.tls: "false"

  policy-tool-backend:
    labels:
      traefik.http.routers.policy-router.rule: (Host(`localhost`) || Host(`127.0.0.1`) || Host(`illuminator.localhost`)) && PathPrefix(`/policy-api`)
      traefik.http.routers.policy-router.entrypoints: web
      traefik.http.routers.policy-router.tls: "false"

  pv-api:
    labels:
      traefik.http.routers.pv-api.rule: (Host(`localhost`) || Host(`127.0.0.1`) || Host(`illuminator.localhost`)) && PathPrefix(`/models/pv`)
      traefik.http.routers.pv-api.entrypoints: web
      traefik.http.routers.pv-api.tls: "false"

  grid-api:
    labels:
      traefik.http.routers.grid-api.rule: (Host(`localhost`) || Host(`127.0.0.1`) || Host(`illuminator.localhost`)) && PathPrefix(`/models/grid`)
      traefik.http.routers.grid-api.entrypoints: web
      traefik.http.routers.grid-api.tls: "false"

  grafana:
    environment:
      GF_SERVER_ROOT_URL: http://illuminator.localhost/grafana
    labels:
      traefik.http.routers.grafana.rule: (Host(`localhost`) || Host(`127.0.0.1`) || Host(`illuminator.localhost`)) && (Path(`/grafana`) || PathPrefix(`/grafana/`))
      traefik.http.routers.grafana.entrypoints: web
      traefik.http.routers.grafana.tls: "false"

  geo:
    environment:
      RUN_AS_ROOT: "true"
      STABLE_EXTENSIONS: ""
    volumes:
      - geoserver-local-data:/opt/geoserver/data_dir
    labels:
      traefik.http.routers.geoserver.rule: (Host(`localhost`) || Host(`127.0.0.1`) || Host(`illuminator.localhost`)) && PathPrefix(`/geoserver`)
      traefik.http.routers.geoserver.entrypoints: web
      traefik.http.routers.geoserver.tls: "false"

  reverse-proxy:
    command:
      - "--log.level=INFO"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.watch=true"
      - "--providers.file.filename=/etc/traefik/dynamic_conf.yml"
      - "--providers.docker=true"
      - "--api.insecure=true"
      - "--api.dashboard=true"

  illuminator-service:
    volumes:
      - ./illuminator-service/config.yml:/app/config.yml:ro
      - illuminator-local-output:/app/output
      - ./illuminator-output/pv.yaml:/app/output/pv.yaml:ro

volumes:
  geoserver-local-data:
  illuminator-local-output:
