services:
  policy-tool-frontend:
    labels:
      traefik.http.routers.dashboard.rule: Host(`localhost`) && PathPrefix(`/dashboard`)

  policy-tool-backend:
    labels:
      traefik.http.routers.policy-router.rule: Host(`localhost`) && PathPrefix(`/policy-api`)

  pv-api:
    labels:
      traefik.http.routers.pv-api.rule: Host(`localhost`) && PathPrefix(`/models/pv`)

  grid-init:
    command:
      - python
      - -m
      - grid_api
      - initialize
      - --fixture
      - /fixtures/alkmaar_grid_fixture.json
      - --allow-fixture
    volumes:
      - ./tests/fixtures/grid/alkmaar_grid_fixture.json:/fixtures/alkmaar_grid_fixture.json:ro

  grid-api:
    labels:
      traefik.http.routers.grid-api.rule: Host(`localhost`) && PathPrefix(`/models/grid`)

  wind-init:
    command:
      - python
      - -m
      - wind_turbine_map.api.initialize
      - --mode
      - fixture
      - --allow-fixture
      - --fixture
      - /fixtures/alkmaar_wind_turbines_fixture.json
    environment:
      WIND_API_ALLOW_FIXTURE: "true"
    volumes:
      - ./tests/fixtures/wind/alkmaar_wind_turbines_fixture.json:/fixtures/alkmaar_wind_turbines_fixture.json:ro

  wind-api:
    environment:
      WIND_API_ALLOW_FIXTURE: "true"
    labels:
      traefik.http.routers.wind-api.rule: Host(`localhost`) && PathPrefix(`/models/wind`)

  layer-publisher:
    environment:
      GRID_EXPECTED_DATA_MODE: fixture
      GRID_EXPORT_BBOX: 4.774287,52.629131,4.779526,52.635583
      WIND_EXPECTED_DATA_MODE: fixture

  grafana:
    environment:
      GF_SERVER_ROOT_URL: https://localhost/grafana
    labels:
      traefik.http.routers.grafana.rule: Host(`localhost`) && (Path(`/grafana`) || PathPrefix(`/grafana/`))

  geo:
    environment:
      RUN_AS_ROOT: "true"
      STABLE_EXTENSIONS: ""
    volumes:
      - geoserver-local-data:/opt/geoserver/data_dir
    labels:
      traefik.http.routers.geoserver.rule: Host(`localhost`) && PathPrefix(`/geoserver`)

  illuminator-service:
    volumes:
      - ./illuminator-service/config.yml:/app/config.yml:ro
      - illuminator-local-output:/app/output
      - ./illuminator-output/pv.yaml:/app/output/pv.yaml:ro

volumes:
  geoserver-local-data:
  illuminator-local-output:
